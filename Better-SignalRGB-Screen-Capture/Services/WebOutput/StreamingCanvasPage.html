<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Better SignalRGB Output</title>
    <style>
        html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
        #stage{position:absolute;left:0;top:0;width:320px;height:200px;transform-origin:0 0}
        #screenContainer{position:absolute;left:0;top:0;width:320px;height:200px;z-index:2}
        #frame,#glow{display:block;width:320px;height:200px;border:0;transform-origin:0 0}
        #glow{position:absolute;inset:0;pointer-events:none;z-index:1;display:none}
        #filters{position:absolute;width:0;height:0;pointer-events:none}
        #placementEditor{position:absolute;box-sizing:border-box;border:1px dashed #65c9ff;z-index:3;touch-action:none;cursor:move;outline:none}
        #placementEditor:focus{border-color:#fff}
        #placementEditor>i{position:absolute;display:block;width:6px;height:6px;background:#fff;border:1px solid #0078d4;box-sizing:border-box;transform:translate(-50%,-50%)}
    </style>
</head>
<body>
    <svg id="filters" aria-hidden="true">
        <filter id="ambilight" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
            <feColorMatrix data-role="cutoff" in="SourceGraphic" type="matrix" result="cutoffMask" />
            <feComposite in="SourceGraphic" in2="cutoffMask" operator="in" result="glowSource" />
            <feMorphology data-role="spread" in="SourceGraphic" operator="dilate" radius="10" result="spread" />
            <feColorMatrix data-role="classic-saturation" in="spread" type="saturate" values="3" result="saturated" />
            <feGaussianBlur data-role="classic-blur" in="saturated" stdDeviation="30" result="classicLight" />
            <feColorMatrix data-role="soft-saturation" in="SourceGraphic" type="saturate" values="3" result="softSaturated" />
            <feGaussianBlur data-role="near" in="softSaturated" result="nearLight" />
            <feGaussianBlur data-role="far" in="softSaturated" result="farLight" />
            <feComposite in="nearLight" in2="farLight" operator="arithmetic" k1="0" k2="0.65" k3="0.35" k4="0" result="softLight" />
            <feComponentTransfer data-role="intensity" in="classicLight" result="intense-light">
                <feFuncR type="linear" slope="1" /><feFuncG type="linear" slope="1" /><feFuncB type="linear" slope="1" />
            </feComponentTransfer>
            <feMerge><feMergeNode in="intense-light" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <filter id="fullscreenAmbilight" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
            <feColorMatrix data-role="cutoff" in="SourceGraphic" type="matrix" result="cutoffMask" />
            <feComposite in="SourceGraphic" in2="cutoffMask" operator="in" result="glowSource" />
            <feMorphology data-role="spread" in="SourceGraphic" operator="dilate" radius="10" result="spread" />
            <feColorMatrix data-role="classic-saturation" in="spread" type="saturate" values="3" result="saturated" />
            <feGaussianBlur data-role="classic-blur" in="saturated" stdDeviation="30" result="classicLight" />
            <feColorMatrix data-role="soft-saturation" in="SourceGraphic" type="saturate" values="3" result="softSaturated" />
            <feGaussianBlur data-role="near" in="softSaturated" result="nearLight" />
            <feGaussianBlur data-role="far" in="softSaturated" result="farLight" />
            <feComposite in="nearLight" in2="farLight" operator="arithmetic" k1="0" k2="0.65" k3="0.35" k4="0" result="softLight" />
            <feComponentTransfer data-role="intensity" in="classicLight">
                <feFuncR type="linear" slope="1" /><feFuncG type="linear" slope="1" /><feFuncB type="linear" slope="1" />
            </feComponentTransfer>
        </filter>
    </svg>
    <div id="stage">
        <canvas id="glow" width="320" height="200"></canvas>
        <div id="screenContainer"><canvas id="frame" width="320" height="200"></canvas></div>
    </div>
    <!--WEB_OUTPUT_SCRIPT-->
</body>
</html>
